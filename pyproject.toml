[project]
name = "parley"
version = "0.1.0"
description = "Full-duplex speech model on Gemma 4 12B with CSM-1B as the talker"
readme = "README.md"
requires-python = "==3.12.*"
license = { text = "Apache-2.0" }
dependencies = [
    "torch==2.12.1",
    "torchaudio==2.11.0",
    "torchvision==0.27.1",
    "transformers==5.14.1",
    "peft==0.20.0",
    "numpy==2.4.6",
    "huggingface-hub>=1.26",
    "safetensors>=0.8",
    "soundfile>=0.14",
    "pydantic>=2.13",
    "pyyaml>=6.0",
    "websockets>=15.0",
]

[project.scripts]
parley = "parley.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/parley"]

[tool.uv]
package = true

[dependency-groups]
dev = [
    "pytest>=9.1",
    "ruff==0.16.5",
    "ty==0.0.57",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 120
[tool.ruff.lint]
select = ["E", "F", "I"]
[tool.ty.environment]
python-version = "3.12"
[tool.ty.src]
include = ["src"]

[tool.ty.terminal]
error-on-warning = false
output-format = "concise"

[tool.ty.rules]
invalid-argument-type = "warn"
unresolved-attribute = "warn"
call-non-callable = "warn"
not-subscriptable = "warn"
